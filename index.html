*{box-sizing:border-box;margin:0;padding:0}

body{

.aurora{
position:fixed;
inset:0;
overflow:hidden;

.aurora div{

}

.a{width:350px;height:350px;top:-130px;left:-100px;background:#6d3cff;opacity:.45}

.wrap{
position:relative;
z-index:2;
min-height:100vh;
width:100%;
max-width:600px;
margin:auto;
padding:20px;
display:flex;
align-items:center;
}

.card{
width:100%;
text-align:center;
padding:38px 25px;
border:1px solid rgba(255,255,255,.15);
border-radius:40px;
background:rgba(255,255,255,.065);
backdrop-filter:blur(25px);

box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.logo{
width:88px;
height:88px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(255,255,255,.25);
box-shadow:0 0 40px rgba(110,80,255,.35);
margin-bottom:25px;
}

.small{
font-size:10px;
letter-spacing:4px;
color:#aaa8bd;
}

h1{
font-size:clamp(40px,10vw,67px);
line-height:.95;
letter-spacing:-3px;
margin:20px 0;
}

.desc{
color:#aaa8b8;
font-size:14px;
line-height:1.7;
max-width:440px;
margin:auto;
}

.orbit{
width:150px;
height:150px;
border:1px solid rgba(255,255,255,.12);
border-radius:50%;
margin:30px auto;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.orbit:before,
.orbit:after{
content:"";
position:absolute;
border-radius:50%;
}

.orbit:before{
width:9px;
height:9px;
background:#8f6cff;
box-shadow:0 0 20px #8f6cff;
top:-4px;
left:50%;
}

.orbit:after{
width:7px;
height:7px;
background:#19cfff;
box-shadow:0 0 18px #19cfff;
bottom:20px;
right:3px;
}

.orbit span{
font-size:10px;
letter-spacing:2px;
color:#bdb9d0;
}

.cta{
display:block;
text-decoration:none;
color:white;
padding:18px;
border-radius:17px;
font-size:13px;
font-weight:700;
background:linear-gradient(100deg,#7547ff,#087fff);
box-shadow:0 15px 40px rgba(79,72,255,.25);
transition:.3s;
}

.cta:hover{
transform:translateY(-3px);
box-shadow:0 20px 50px rgba(79,72,255,.4);
}

.note{
font-size:9px;
color:#656273;
line-height:1.5;
margin-top:17px;
}

.agency{
font-size:9px;
margin-top:20px;

.agency a{
